name: pliqra
services:
  pliqra:
    image: pliqra:2.4.1
    build: .
    ports:
      - "127.0.0.1:${PLIQRA_HTTP_PORT:-8088}:8080"
    environment:
      PLIQRA_TRUSTED_PROXIES: ${PLIQRA_TRUSTED_PROXIES:-}
      PLIQRA_OTEL_ENABLED: ${PLIQRA_OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://localhost:4318/v1/traces}
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:-3}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
      PLIQRA_PUBLIC_URL: ${PLIQRA_PUBLIC_URL:-}
      PLIQRA_SECURE_COOKIES: ${PLIQRA_SECURE_COOKIES:-0}
      PLIQRA_ENCRYPTION_KEY: ${PLIQRA_ENCRYPTION_KEY:-}
    volumes:
      - pliqra-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pliqra-data:
    name: pliqra-data
