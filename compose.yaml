name: pliqra
services:
  pliqra:
    image: pliqra:2.1.0
    build: .
    ports:
      - "127.0.0.1:${PLIQRA_HTTP_PORT:-8088}:8080"
    environment:
      PLIQRA_PUBLIC_URL: ${PLIQRA_PUBLIC_URL:-}
      PLIQRA_SECURE_COOKIES: ${PLIQRA_SECURE_COOKIES:-0}
      PLIQRA_ENCRYPTION_KEY: ${PLIQRA_ENCRYPTION_KEY:-}
    volumes:
      - pliqra-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pliqra-data:
    name: pliqra-data
