# SQLite maintenance only. Apply in an isolated drill namespace AFTER scaling
# its gateway to zero and waiting for its pods to terminate. This pod never
# starts a server. Change claimName if the recovery release has another name.
# OpenShift restricted-v2 supplies UID, fsGroup and SELinux labels. Use the
# recovery release namespace and verify its storage supports the assigned fsGroup.
apiVersion: v1
kind: Pod
metadata:
  name: pliqra-recovery
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: recovery
      image: ghcr.io/eturkok/pliqra@sha256:10a490c90000261635ba29b69864128f6936ba9112b35dfb0ca1216e462a64f1
      command: [python, -c, "import time; time.sleep(3600)"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "1", memory: 512Mi}
      volumeMounts:
        - {name: data, mountPath: /data}
        - {name: tmp, mountPath: /tmp}
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: pliqra
    - name: tmp
      emptyDir: {}
