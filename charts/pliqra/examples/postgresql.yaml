storage:
  mode: postgresql
replicaCount: 2
database:
  existingSecret: pliqra-backend
  urlKey: database-url
  tls:
    existingSecret: pliqra-database-ca
encryption:
  existingSecret: pliqra-backend
podDisruptionBudget:
  enabled: true
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
# For a strict two-zone requirement, use a multi-zone cluster and add:
# - maxSkew: 1
#   topologyKey: topology.kubernetes.io/zone
#   whenUnsatisfiable: DoNotSchedule
#   minDomains: 2
# Hard constraints can leave pods Pending if the required capacity is absent.
