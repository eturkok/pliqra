# Initialize the administrator through port-forward before enabling ingress.
config:
  publicUrl: https://models.example.com
  secureCookies: true
ingress:
  enabled: true
  className: nginx
  host: models.example.com
  tlsSecret: pliqra-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "off"
