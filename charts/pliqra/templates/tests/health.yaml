{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test" (include "pliqra.fullname" . | trunc 58 | trimSuffix "-") }}
  labels:
    # Hook Pods must not match the gateway ReplicaSet's adoption selector.
    app.kubernetes.io/name: {{ printf "%s-test" (include "pliqra.name" . | trunc 58 | trimSuffix "-") }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "pliqra.serviceAccount" . }}
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: check
      image: {{ include "pliqra.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command: [python, -c]
      args:
        - >-
          import json,urllib.request;
          base='http://{{ include "pliqra.fullname" . }}:{{ .Values.service.port }}';
          assert json.load(urllib.request.urlopen(base+'/readyz',timeout=10))['status']=='ok';
          assert 'protocol' in json.load(urllib.request.urlopen(base+'/.well-known/pliqra',timeout=10));
          print('Readiness and protocol discovery passed')
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
{{- end }}
