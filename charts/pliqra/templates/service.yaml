apiVersion: v1
kind: Service
metadata:
  name: {{ include "pliqra.fullname" . }}
  labels:
    {{- include "pliqra.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pliqra.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
