name: pliqra-enterprise

x-gateway: &gateway
  image: pliqra:2.1.0-rc.4
  build: .
  environment:
    PLIQRA_DATABASE_URL: postgresql://pliqra:${PLIQRA_DB_PASSWORD:?Set PLIQRA_DB_PASSWORD}@postgres:5432/pliqra
    PLIQRA_ENCRYPTION_KEY: ${PLIQRA_ENCRYPTION_KEY:?Set a shared PLIQRA_ENCRYPTION_KEY}
    PLIQRA_PUBLIC_URL: ${PLIQRA_PUBLIC_URL:-}
    PLIQRA_SECURE_COOKIES: ${PLIQRA_SECURE_COOKIES:-0}
  depends_on:
    postgres:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: pliqra
      POSTGRES_USER: pliqra
      POSTGRES_PASSWORD: ${PLIQRA_DB_PASSWORD:?Set PLIQRA_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pliqra -d pliqra"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  gateway-a:
    <<: *gateway
    volumes:
      - gateway-a-state:/data
  gateway-b:
    <<: *gateway
    volumes:
      - gateway-b-state:/data
  proxy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:${PLIQRA_HTTP_PORT:-8088}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      gateway-a:
        condition: service_healthy
      gateway-b:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  gateway-a-state:
  gateway-b-state:
