name: Synthetic customer acceptance
on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      expected_revision:
        type: string
        required: true
      sdk_artifact_run_id:
        type: string
        required: true
      stable:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: 'Synthetic soak duration (0–3600 seconds)'
        type: string
        default: '600'
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt -r requirements-sdk.txt
      - name: Build SDKs for a standalone acceptance run
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/build_sdks.py
      - name: Download the exact tested SDK assets for a release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_RUN: ${{ inputs.sdk_artifact_run_id }}
        run: gh run download "$SDK_RUN" --name release-sdk-packages --dir dist/sdk
      - name: Build an isolated local image
        if: github.event_name == 'workflow_dispatch'
        run: docker build --build-arg REVISION="$GITHUB_SHA" -t pliqra:acceptance .
      - name: Pull the exact release image by digest
        if: github.event_name != 'workflow_dispatch'
        env:
          IMAGE: ${{ inputs.image }}
          REVISION: ${{ inputs.expected_revision }}
        run: |
          docker pull "$IMAGE"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$REVISION"
      - name: Exercise onboarding, quota, fleet, streaming, load, soak and recovery
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds || '60' }}
          IMAGE: ${{ inputs.image || 'pliqra:acceptance' }}
          STABLE: ${{ inputs.stable }}
        run: |
          if [ "$STABLE" = true ]; then
            python scripts/customer_acceptance.py --state work/customer-ci --image "$IMAGE" --stable --keep
          else
            python scripts/customer_acceptance.py --state work/customer-ci --image "$IMAGE" --soak-seconds "$SOAK_SECONDS" --keep
          fi
      - name: Invoke from independently installed Python and npm applications
        run: python scripts/check_customer_clients.py work/customer-ci
      - name: Verify official native clients against synthetic upstreams
        run: |
          python -m venv work/official-client-env
          work/official-client-env/bin/python -m pip install -r requirements-acceptance.txt
          work/official-client-env/bin/python tests/acceptance/official_clients.py work/customer-ci
      - name: Verify upgrade, persistent policies, backup and recovery from the previous published image
        env:
          IMAGE: ${{ inputs.image || 'pliqra:acceptance' }}
        run: python scripts/check_release_upgrade.py --image "$IMAGE" --output work/customer-ci/upgrade.json
      - name: Remove only the owned disposable lab
        if: always()
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          state=Path('work/customer-ci')
          if (state/'lab.json').exists():
              project=json.loads((state/'lab.json').read_text())['project']
              assert project.startswith('pliqra-accept-')
              subprocess.run(['docker','compose','--project-name',project,'--env-file',str(state/'fixture.env'),'-f','tests/acceptance/compose.yaml','down','--volumes'],check=True)
          PY
      - name: Retain only public synthetic results, never credentials or fixture keys
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-customer-results
          path: |
            work/customer-ci/report.json
            work/customer-ci/installed-clients.json
            work/customer-ci/official-clients.json
            work/customer-ci/upgrade.json
          if-no-files-found: warn
          retention-days: 14
