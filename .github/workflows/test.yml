name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit==2.10.1
      - name: Reject known runtime dependency vulnerabilities without suppressions
        run: python -m pip_audit -r requirements.lock --format json --output dependency-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          PLIQRA_REQUIRE_LANGUAGES: "1"
      - run: python -m compileall -q pliqra sdk examples
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build -t pliqra:ci .
      - name: Smoke test a fresh single-container workspace
        run: |
          set -eu
          docker run -d --name pliqra-ci -p 127.0.0.1:8088:8080 pliqra:ci
          trap 'docker logs pliqra-ci; docker rm -fv pliqra-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8088/healthz; then
              curl --fail --silent http://localhost:8088/.well-known/pliqra
              exit 0
            fi
            sleep 1
          done
          exit 1
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: pliqra
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-synthetic-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pliqra"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PLIQRA_TEST_POSTGRES_URL: postgresql://postgres:ci-synthetic-password@localhost:5432/pliqra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_scale.py tests/test_multidc.py tests/test_fleet.py -q
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: JavaScript client boundaries and streaming
        run: node sdk/javascript/test.mjs
      - name: Go client boundaries and streaming
        working-directory: sdk/go
        run: go test ./...
  sdk-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-sdk.txt
      - run: python scripts/build_sdks.py
      - run: python -m twine check dist/sdk/*.whl dist/sdk/*.tar.gz
      - run: python scripts/check_sdk_install.py dist/sdk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-packages
          path: dist/sdk/*
          retention-days: 14
          if-no-files-found: error
  sdk-compatibility:
    needs: sdk-packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.10'
            node: '22'
          - python: '3.14'
            node: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: sdk-packages
          path: dist/sdk
      - run: python scripts/check_sdk_install.py dist/sdk
      - run: node sdk/javascript/test.mjs
